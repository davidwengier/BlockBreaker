<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // GitHub Pages lets browsers cache files for 10 minutes; a unique query string always loads the latest deploy.
    const cacheBuster = Date.now();
    document.write(`<link rel="stylesheet" href="style.css?v=${cacheBuster}">`);
  </script>
</head>

<body>
  <div class="layout">
    <canvas id="game" width="640" height="480"></canvas>
    <ul id="legend"></ul>
  </div>
  <p class="help">Move: ← → / A D / mouse / touch<br />
    Launch: Space or click (click captures the mouse, Esc releases it)</p>
  <script>document.write(`<script src="game.js?v=${cacheBuster}"><\/script>`);</script>
</body>

</html>
